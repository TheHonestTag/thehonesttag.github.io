.lca-ed h2,.lca-ed h3,.lca-ed strong,.lca-ed td,.lca-ed summary,.lca-ed button:not(.lca-i),.lca-ed li{color:var(--ink)!important}
.lca-ed p,.lca-ed .lca-note,.lca-ed .dd-note,.lca-ed span:not(.lca-b),.lca-ed .lca-i{color:var(--muted)!important}
.lca-ed a,.lca-ref-link{color:var(--accent)!important}
.lca-ed .lca-b{filter:none}
.lca-ed-bar,.lca-ed-actions{background:var(--card)!important;border:0!important;border-radius:16px!important;box-shadow:var(--pshadow)}
.lca-ed button{background:var(--soft)!important;border-color:transparent!important;border-radius:980px!important}
.lca-ed .lca-ed-actions button:first-child:not([disabled]){background:var(--sel)!important;color:#fff!important}
.lca-ed input,.lca-ed select{border-color:var(--rule)!important;background:var(--card)}
.lca-ed td.lca-edited{background:color-mix(in srgb,var(--bad) 14%,var(--card))!important}
.lca-ed details,.lca-ed .lca-sec{border-color:var(--rule)!important}
svg text{fill:var(--ink)}
svg text[fill-opacity],svg .muted{fill:var(--muted)}
.ht-stage-card{background:var(--soft)!important;color:var(--ink)!important}
.ht-stage-card .ht-stage-v{background:var(--card)!important}
.ht-seg,.ht-bseg{color:#14181F}
.lca-sr{color:var(--ink)}
.fill-neutral-300,.fill-neutral-400,.fill-neutral-500,.fill-neutral-600{fill:var(--muted)!important}
.fill-neutral-700,.fill-neutral-800,.fill-neutral-900{fill:var(--ink)!important}
.stroke-neutral-200,.stroke-neutral-300{stroke:var(--rule)!important}
.ht-dd-qi,.ht-dd-q .ht-dd-qi{background:var(--soft)!important}
.lca-ed .ht-adv button{background:var(--card)!important;color:var(--ink)!important;border-radius:980px!important}
.lca-ed .ht-adv button.go{background:var(--sel)!important;color:#fff!important}
nav[aria-label="Main (mobile)"]{flex-wrap:wrap!important;overflow:visible!important}
nav[aria-label="Main (mobile)"] button{flex:none;padding:7px 10px!important;font-size:13px!important}
/* ===== Deep Dive: full-width summary and clickable flow ===== */
.ht-wb{padding:26px 28px!important}
.ht-sum-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ht-sum-head h2{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--ink);margin:0}
.ht-sum-head p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.ht-sum-btn{border:0;border-radius:980px;background:var(--sel);color:#fff;font-weight:600;font-size:14px;padding:9px 18px;cursor:pointer}
.ht-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}
.ht-stat{background:var(--soft);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ht-stat-l{font-size:13px;font-weight:600;color:var(--muted)}
.ht-stat-v{font-size:40px;line-height:1;font-weight:700;letter-spacing:-.04em;color:var(--ink)}
.ht-stat-v span{font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted)}
.ht-stat-s{margin:0;font-size:13px;color:var(--muted)}.ht-stat-s b{color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600}
.ht-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.ht-spec{margin:0}
.ht-trust{display:flex;flex-direction:column;gap:14px;min-width:0}
.ht-trust .ht-dd-v,.ht-trust .ht-dd-x{margin:0}
@media(max-width:860px){.ht-stats{grid-template-columns:1fr}.ht-cols{grid-template-columns:1fr}.ht-wb{padding:20px 16px!important}.ht-stat-v{font-size:34px}}
.ht-fnode{cursor:pointer;transition:opacity .15s}.ht-fnode:hover rect{filter:brightness(1.12)}
.ht-fnode{outline:none}.ht-fnode:focus-visible rect{stroke:var(--sel);stroke-width:2}
.ht-fnode.on rect{stroke:var(--ink);stroke-width:2}
.ht-fband{cursor:pointer;transition:fill-opacity .15s}.ht-fband:hover{fill-opacity:.7!important}
#ht-drill-i{margin-top:18px}
.ht-fp-body{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:14px;color:var(--ink)}
.ht-fp-body p{margin:0;line-height:1.5}.ht-fp-q{color:var(--muted)}
.ht-fp-rows{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.ht-fp-row{display:grid;grid-template-columns:12px 1fr auto 48px 64px;gap:10px;align-items:center;text-align:left;border:0;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink);cursor:pointer}
.ht-fp-row i{width:10px;height:10px;border-radius:3px}.ht-fp-row b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600;font-size:13px}.ht-fp-row em{font-style:normal;color:var(--muted);text-align:right}.ht-fp-row u{text-decoration:none;color:var(--accent);font-weight:600;text-align:right}
@media(max-width:560px){.ht-fp-row{grid-template-columns:12px 1fr auto}.ht-fp-row em,.ht-fp-row u{display:none}}
.ht-drill{background:var(--card)!important;border:0!important;border-radius:22px!important;box-shadow:var(--pshadow)}
.ht-dd-x.ht-fold>summary{margin-top:0}.ht-dd-x.ht-fold[open]>ul{margin-top:10px}.ht-dd-x h3{margin:0!important}
.ht-spec>div{padding-block:8px!important}
.ht-fread{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;background:var(--soft);border-radius:12px;font-size:14px;color:var(--ink)}
.ht-fread i{width:10px;height:10px;border-radius:3px}.ht-fread b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600;font-size:13px}.ht-fread em{font-style:normal;color:var(--muted)}.ht-fread .ht-dr-x{margin-left:auto}
/* ===== Compare the choices ===== */
.ht-cmp h2{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--ink);margin:0}
.ht-cmp-intro{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.ht-cmp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
.ht-cmp-card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:12px}

.ht-cmp-card h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.ht-cmp-sub{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.ht-cmp-say{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink);display:flex;flex-direction:column;gap:2px}.ht-cmp-say p{margin:0}
.ht-cmp-note{margin:0;font-size:12.5px;color:var(--muted)}
.ht-cbars{display:flex;flex-direction:column;gap:6px}
.ht-cb{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 150px;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--ink)}
.ht-cb-n{display:flex;align-items:center;gap:8px;min-width:0}.ht-cb-n em{font-style:normal;font-size:11px;font-weight:600;color:#fff;background:var(--sel);border-radius:980px;padding:1px 8px;white-space:nowrap}
.ht-cb-t{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}.ht-cb-t i{display:block;height:100%;border-radius:6px;background:color-mix(in srgb,var(--muted) 45%,var(--card))}
.ht-cb.on .ht-cb-t i{background:var(--sel)}
.ht-cb b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600;font-size:12.5px;text-align:right;white-space:nowrap}
.ht-cb small{grid-column:2/4;color:var(--muted);font-size:11.5px;margin-top:-4px}
.ht-cmp-more{align-self:flex-start;border:0;background:var(--soft);color:var(--ink);border-radius:980px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.ht-eol-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}.ht-eol-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.ht-eol{display:flex;flex-direction:column;gap:10px}
.ht-eol-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:13.5px;color:var(--ink)}
.ht-eol-r .ht-cb-n{grid-column:1/3}
.ht-eol-bar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--soft)}.ht-eol-bar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:600;color:#fff;min-width:0}
.ht-eol-r b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600;font-size:12.5px}
.ht-eol-st{grid-column:1/3;color:var(--muted);font-size:11.5px;margin-top:-2px}
.ht-eol-r.on .ht-eol-bar{outline:2px solid var(--sel);outline-offset:1px}
@media(max-width:860px){.ht-cmp-grid{grid-template-columns:1fr}.ht-cmp-card{padding:18px 16px}.ht-cb{grid-template-columns:minmax(0,1fr) auto}.ht-cb .ht-cb-t{grid-column:1/3;grid-row:2}.ht-cb small{grid-column:1/3}}
.ht-stats{grid-template-columns:repeat(4,minmax(0,1fr))!important}.ht-stat-v{font-size:34px!important}
@media(max-width:1100px){.ht-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:560px){.ht-stats{grid-template-columns:1fr!important}}
.ht-cmp-wide{grid-column:1/-1}

.lca-ro .lca-ed-bar,.lca-ro .lca-row-actions,.lca-ro .lca-paste,.lca-ro td .x,.lca-ro th:last-child,.lca-ro td:last-child:has(.x){display:none!important}
.lca-ro input:disabled,.lca-ro select:disabled{opacity:1;-webkit-text-fill-color:var(--ink);color:var(--ink);background:transparent!important;border-color:transparent!important;appearance:none;-webkit-appearance:none;cursor:default}
.ht-adv{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0;padding:16px 18px;border-radius:18px;background:var(--soft)}
.ht-adv b{font-size:15px;color:var(--ink)}.ht-adv p{margin:3px 0 0;font-size:13px;color:var(--muted);max-width:56ch}
.ht-adv.on{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.ht-adv button{border:0;border-radius:980px;padding:9px 18px;font-size:14px;font-weight:600;background:var(--card);color:var(--ink);cursor:pointer}
.ht-adv button.go{background:var(--sel);color:#fff}
.ht-custom{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--bad) 13%,var(--card));font-size:13px;color:var(--ink)}
.ht-custom p{margin:2px 0 6px;color:var(--muted)}.ht-custom a{color:var(--accent);font-weight:600;font-size:13px}
.ht-custom-tag{color:var(--bad)}

.ht-fold>summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;margin-top:18px}
.ht-fold>summary::-webkit-details-marker{display:none}
.ht-fold>summary h3{margin:0!important}
.ht-n{color:var(--muted);font-size:13px;font-weight:500}
.ht-show,.ht-hide{margin-left:auto;padding:7px 14px;border-radius:980px;background:var(--soft);color:var(--ink);font-size:13px;font-weight:600}
.ht-show::after,.ht-hide::after{content:" ▾"}.ht-hide::after{content:" ▴"}
.ht-fold[open] .ht-show,.ht-fold:not([open]) .ht-hide{display:none}
.ht-fold>.lca-refs{margin-top:12px}.ht-fold>.lca-note{margin-top:12px}
.lca-ed .ht-fold-btn{display:inline-flex;align-items:center;gap:8px;margin:6px 0 10px;padding:8px 16px;border:0;border-radius:980px;background:var(--soft)!important;color:var(--ink)!important;font-size:13px;font-weight:600;cursor:pointer}
.ht-collapsed .lca-scroll,.ht-collapsed .lca-row-actions,.ht-collapsed .lca-paste{display:none!important}

.ht-beta{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:980px;padding:2px 8px}
.ht-betanote{color:var(--muted);font-size:13px;text-align:center}
</style></head><body><div id="root"><p style="padding:24px;font-family:system-ui,sans-serif;color:#555">Loading The Honest Tag…</p></div><script>window.addEventListener('error',function(e){var r=document.getElementById('root');if(r&&!r.dataset.ok)r.innerHTML='<pre style="padding:16px;white-space:pre-wrap;font:12px monospace">Error: '+String(e.message)+'</pre>';});</script><script src="app3.js"></script></body></html>
