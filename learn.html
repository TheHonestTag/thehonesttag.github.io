<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Short, sourced facts about clothes and the environment, with the source and year on every card.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M14 22 L32 8 L50 22 V52 a4 4 0 0 1 -4 4 H18 a4 4 0 0 1 -4 -4 Z%27 stroke=%2314181F stroke-width=%275%27/%3E%3Ccircle cx=%2732%27 cy=%2722%27 r=%275%27 stroke=%23C8571F stroke-width=%275%27/%3E%3Cpath d=%27M24 38 H40 M24 46 H34%27 stroke=%2314181F stroke-width=%275%27/%3E%3C/svg%3E">
<title>Learn – The Honest Tag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --rule:#D2D2D7; --soft:#E8E8ED; --sel:#0071E3; --on-sel:#FFFFFF;
  --accent:#0066CC; --thread:#0071E3; --good:#2E7D5B; --bad:#B4432A;
  --s-raw:#A9BCCB; --s-yarn:#8EA6BA; --s-wet:#5F7F9A; --s-asm:#2F4B63; --s-fr:#D9667A; --s-use:#4F9D8A; --s-eol:#8C6A9E;
  --label:#FFFFFF; --shadow:0 24px 60px -24px rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#A1A1A6; --rule:#38383A; --soft:#2C2C2E; --sel:#0A84FF; --on-sel:#FFFFFF;
  --accent:#2997FF; --thread:#0A84FF; --good:#5CC093; --bad:#E7765C; --label:#1C1C1E; --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#A1A1A6; --rule:#38383A; --soft:#2C2C2E; --sel:#0A84FF; --on-sel:#FFFFFF;
  --accent:#2997FF; --thread:#0A84FF; --good:#5CC093; --bad:#E7765C; --label:#1C1C1E; --shadow:0 18px 40px -22px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--thread);outline-offset:2px}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1120px;margin:0 auto;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;color:var(--ink)}
.brand svg{width:24px;height:24px}
.proto{font-size:13px;color:var(--muted)}
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start;padding-bottom:120px}

/* hero: the care label */
.hero{padding-block:40px 24px;max-width:620px}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 16px;text-wrap:balance}
.hero p{font-size:18px;color:var(--muted);margin:0 0 28px;max-width:52ch}
.care{position:relative;background:var(--label);border-radius:4px;padding:26px 24px 22px;box-shadow:var(--shadow);
  outline:1px dashed color-mix(in srgb,var(--muted) 45%,transparent);outline-offset:-9px}
.care::before,.care::after{content:"";position:absolute;left:24px;right:24px;height:0;border-top:1px dashed color-mix(in srgb,var(--muted) 35%,transparent)}
.care::before{top:0;display:none}
.care label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.care textarea{width:100%;min-height:86px;resize:vertical;border:0;background:transparent;font:500 19px/1.5 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.01em;padding:0;outline:none}
.care textarea::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.care .hint{font-size:13px;color:var(--muted);margin-top:6px}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.examples button{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.examples button:hover{border-color:var(--ink)}
.read{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:5px 10px;font-size:14px;background:var(--soft)}
.chip.ok{background:color-mix(in srgb,var(--good) 14%,transparent)}
.chip.guess{background:transparent;border:1px dashed var(--rule)}
.chip b{font-weight:700}
.miss{font-size:14px;color:var(--bad)}
.tagh{font-weight:600;letter-spacing:.02em;margin:2px 0 -4px}
.notag{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--rule);padding-top:14px}
.notag .q{display:flex;flex-direction:column;gap:6px}.notag .ql{font-size:14px;font-weight:600}
.notag .vchips{margin:0}.notag .vchip:disabled{opacity:.45;cursor:not-allowed}
.notag p.small,#asmnote,#mill-asm{margin:0}
.hero .notag p.small,.hero #asmnote{font-size:13px;line-height:1.45;max-width:none;color:var(--muted)}
.vchip[aria-pressed="true"]:hover{background:var(--sel);color:var(--on-sel)}
.garments{display:flex;flex-wrap:wrap;gap:6px}
.garments button{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:6px 11px;font-size:14px;cursor:pointer}
.garments button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.go{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);padding:13px 20px;font-weight:700;cursor:pointer;font-size:16px}
.go:disabled{opacity:.4;cursor:not-allowed}
.small{font-size:14px;color:var(--muted)}

/* journey with the thread */
.journey{position:relative;padding-left:44px;margin-top:40px}
.journey[hidden]{display:none}
.thread{position:absolute;left:13px;top:0;bottom:0;width:2px;background-image:repeating-linear-gradient(to bottom,var(--rule) 0 9px,transparent 9px 15px)}
.thread i{position:absolute;inset:0 0 auto 0;height:0;background-image:repeating-linear-gradient(to bottom,var(--thread) 0 9px,transparent 9px 15px);transition:height .25s linear}
.needle{position:absolute;left:7px;width:14px;height:14px;border-radius:50%;background:var(--thread);box-shadow:0 0 0 4px color-mix(in srgb,var(--thread) 22%,transparent);transition:top .25s linear}
.stop{position:relative;padding-block:24px 64px;min-height:62vh}
.stop:last-child{min-height:0}
.knot{position:absolute;left:-38px;top:32px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--rule);transition:border-color .2s,background .2s}
.stop.reached .knot{border-color:var(--thread);background:var(--thread)}
.where{font-size:14px;color:var(--muted);margin:0 0 4px}
.stop h2{font-size:clamp(26px,3.6vw,36px);line-height:1.1;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.stop .lede{font-size:18px;max-width:54ch;margin:0 0 22px}
.big{font-weight:700}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px}
.panel h3{font-size:15px;margin:0 0 4px}
.panel .small{margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .n{font-weight:600;font-size:14px}
.opt .d{font-size:13px}
.d.up{color:var(--bad)} .d.down{color:var(--good)} .d.same{color:var(--muted)}
.wmap{min-width:0}
.vchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.vchip{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.off{display:none!important}
.dnote{margin:2px 0 8px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.dq{margin:14px 0 6px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
#dest-reg,#dest-ctry{margin-bottom:8px}
#dest-ctry .vchip{font-size:12.5px;padding:6px 12px;min-height:34px}
#dest-ctry .vchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.vchip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.wsvg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto;border-radius:10px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid var(--rule);touch-action:manipulation}
.wsvg .land{fill:color-mix(in srgb,var(--ink) 9%,var(--card));stroke:var(--rule);stroke-width:1px;vector-effect:non-scaling-stroke}
.wsvg .cp{stroke:var(--card);stroke-width:1.2px;vector-effect:non-scaling-stroke;cursor:pointer;outline:none}
.wsvg .cp:hover,.wsvg .cp:focus-visible{stroke:var(--ink);stroke-width:2.4px}
.wsvg .cp[aria-pressed="true"]{stroke:var(--ink);stroke-width:1.6px}
.wsvg .wd{font-weight:700}
.wsvg .wd .up{fill:var(--bad)}
.wsvg .wd .dn{fill:var(--good)}
.wsvg .hit{fill:transparent;cursor:pointer}
body.sheet-open #ht-cc-open{display:none!important}
.wsvg .ldr{stroke:var(--ink);stroke-width:1px;vector-effect:non-scaling-stroke;opacity:.55;pointer-events:none}
.wsvg circle.ldr{fill:var(--ink);stroke:none}
.wsvg .wl{fill:var(--ink);font-weight:800;letter-spacing:.02em;pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;vector-effect:non-scaling-stroke;font-family:inherit}
.tinfo{margin:14px 0 6px;font-weight:600;font-size:15px;min-height:1.6em}
.tleg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tleg i{display:block;width:110px;height:8px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--good) 58%,var(--card)),var(--card),color-mix(in srgb,var(--bad) 58%,var(--card)));border:1px solid var(--rule)}
.tlist{margin-top:14px;font-size:14px}
.tlist summary{cursor:pointer;color:var(--accent);font-weight:600}
.tlist .clist{margin-top:10px}
.clist{display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr) minmax(58px,auto);align-items:center;gap:10px;width:100%;padding:9px 12px}
.crow .cn{display:flex;flex-direction:column;gap:1px;min-width:0}
.crow .gs{font-size:11.5px;color:var(--muted);white-space:nowrap}
.crow .d{text-align:right;white-space:nowrap}
.cbar{position:relative;height:8px;border-radius:4px;background:color-mix(in srgb,var(--rule) 60%,transparent)}
.cbar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);opacity:.45;border-radius:1px}
.cfill{position:absolute;top:0;bottom:0;border-radius:4px;transition:width .35s ease}
.cfill.down{right:50%;background:var(--good)} .cfill.up{left:50%;background:var(--bad)}
.cgap{font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
.cgap::before,.cgap::after{content:"";display:inline-block;width:28px;border-top:1px dashed var(--rule);vertical-align:middle;margin:0 8px}
.cmore{align-self:flex-start;margin-top:4px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.cchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.cchip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.cchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
@media (max-width:420px){.crow{grid-template-columns:minmax(0,1fr) minmax(40px,.8fr) minmax(54px,auto);gap:8px;padding:9px 10px}.crow .gs{font-size:10.5px}}
@media (prefers-reduced-motion:reduce){.cfill{transition:none}}
.slider{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.slider input[type=range]{flex:1;min-width:180px;accent-color:var(--ink)}
.slider output{font-weight:700;min-width:90px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:22px;margin-top:14px}
.fact .v{font-size:22px;font-weight:700}
.fact .l{font-size:13px;color:var(--muted)}
.curvewrap{position:relative;margin-top:10px;cursor:crosshair;touch-action:pan-y}.curvewrap .curve{margin-top:0}
.cdot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--s-use);border:2px solid var(--card);box-shadow:0 0 0 1px var(--s-use);pointer-events:none}
.curve{width:100%;height:120px;margin-top:10px;display:block}
.callout{border-left:3px solid var(--thread);padding:4px 0 4px 14px;margin-top:16px;max-width:56ch}
.finale .lever{font-size:20px;max-width:46ch}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.ghost{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:10px;padding:12px 18px;font-weight:700;text-decoration:none;color:var(--ink);background:transparent;cursor:pointer}

/* the hang tag */
.tagcol{position:sticky;top:20px;padding-top:40px}
.hang{position:relative;padding-top:46px}
.hang svg.loop{position:absolute;left:50%;top:0;transform:translateX(-50%);width:70px;height:60px}
.tag{position:relative;background:var(--label);border:2px solid var(--ink);border-radius:14px 14px 10px 10px;padding:26px 20px 18px;box-shadow:var(--shadow)}
.tag .hole{position:absolute;left:50%;top:12px;width:14px;height:14px;margin-left:-7px;border:2px solid var(--ink);border-radius:50%;background:var(--paper)}
.tag h4{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:10px 0 8px;line-height:1}
.tag .bar0{height:6px;background:var(--ink);margin-bottom:12px}
.tag .who{font-weight:700;font-size:16px}
.tag .whosub{font-size:13px;color:var(--muted);margin-bottom:12px}
.total{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;position:relative}
.total .v{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.total .u{font-size:15px;color:var(--muted)}
.delta{font-size:13px;font-weight:700;padding:2px 7px;border-radius:5px;opacity:0;transition:opacity .2s}
.delta.show{opacity:1}
.delta.up{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.delta.down{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.sbar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:12px 0 10px;background:repeating-linear-gradient(90deg,var(--soft) 0 6px,transparent 6px 9px)}
.sbar span{display:block;height:100%;transition:width .35s ease}
.sbar span[data-tip]{cursor:help}
.sbar span[data-tip]:hover,.sbar span[data-tip]:focus-visible{filter:brightness(1.18);outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.rows li[data-tip]{cursor:help;border-radius:4px}
.rows li[data-tip]:hover,.rows li[data-tip]:focus-visible{background:var(--soft);outline:none}
.ttip{display:none;position:fixed;z-index:60;max-width:270px;padding:9px 11px;border-radius:9px;background:var(--ink);color:var(--card);font-size:13px;line-height:1.4;pointer-events:none;box-shadow:var(--shadow)}
.ttip b{display:block;font-size:14px}.ttip .num{display:block;margin:1px 0 4px;font-weight:700;opacity:.9}
.rows{list-style:none;margin:0;padding:0;font-size:14px}
.rows li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--rule)}
.rows li:last-child{border-bottom:0}
.rows .k{display:flex;align-items:center;gap:8px}
.rows .k i{width:10px;height:10px;border-radius:2px;display:inline-block}
.rows li.todo{color:var(--muted)}
.rows li.todo .v{letter-spacing:.2em}
.rows li.now{font-weight:700}
.minor{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:2px solid var(--ink);font-size:14px}
.minor div{display:flex;flex-direction:column}
.minor .v{font-weight:700;font-size:16px}
.tag .foot{font-size:12px;color:var(--muted);margin-top:10px}
.sheetbtn{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .tagcol{position:fixed;left:0;right:0;bottom:0;top:auto;padding:0;z-index:20;pointer-events:none;display:flex;flex-direction:column}
  .sheetbtn{order:2}
  .tagcol .hang{display:none;pointer-events:auto;max-height:78vh;overflow:auto;padding:46px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-top:1px solid var(--rule)}
  .tagcol.open .hang{display:block}
  .sheetbtn{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:2px solid var(--ink);background:var(--label);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:pointer;text-align:left}
  .sheetbtn .v{font-size:22px;font-weight:800}
  .sheetbtn .mini{flex:1;display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--soft);min-width:60px}
  .sheetbtn .mini span{height:100%}
  .sheetbtn .lab{font-size:13px;color:var(--muted)}
  .journey{padding-left:34px}
  .thread{left:8px} .needle{left:2px} .knot{left:-32px}
  .stop{min-height:0;padding-block:20px 56px}
  body{padding-bottom:70px}
}
.lede .num,.lever .num,.total .v,.sheetbtn .v,.fact .v{font-family:inherit;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,31,.12)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:4px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:11px 13px;cursor:pointer;min-width:0}
.pick:hover{border-color:var(--ink)}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pick .n{font-weight:700}
.pick .d{font-size:13px;opacity:.75}
.textlink{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;cursor:pointer}
body[data-view="read"] .tagcol,body[data-view="read"] #journey,body[data-view="read"] #v-follow{display:none}
body[data-view="read"] .shell{grid-template-columns:minmax(0,1fr)}
body[data-view="follow"] #v-read{display:none}
@media (max-width:520px){.brand span{display:none}}
@media (max-width:900px){.tagcol:not(.live){display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* --- Apple-inspired look: system type, pale grey canvas, flat white cards, one blue accent --- */

var LC={"en": {"title": "Learn – The Honest Tag", "h1": "What the numbers mean, and where they come from.", "intro": "Short facts about clothes and the environment.", "src": "Source", "cards": [{"tag": "Method", "h": "What a life-cycle assessment is, and isn’t", "p": "A life-cycle assessment (LCA) adds up the environmental impact of a product across its life. Cradle to gate stops at the factory door; cradle to grave also counts use and disposal. The method is set out in the ISO 14040 and 14044 standards. The result is a screening estimate: it is built to compare choices, not to certify one garment.", "src": "ISO 14040:2006 and ISO 14044:2006", "url": "", "chip": "Standard", "go": "How we calculate it", "href": "calculator.html#data"}, {"tag": "Scale", "h": "Clothing production has doubled, and we wear each piece less", "p": "Between about 2000 and 2015, clothing production roughly doubled. Over the same period, the number of times a garment is worn before it is thrown away fell by 36%.", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Sourced"}, {"tag": "Climate and water", "h": "Textiles: 1.2 billion tonnes of CO₂e and 93 billion m³ of water a year", "p": "The same report estimates that textile production emitted about 1.2 billion tonnes of CO₂e in 2015 and used around 93 billion cubic metres of water a year, including cotton farming. Newer studies give different totals, so read these as an order of magnitude.", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Sourced"}, {"tag": "Hotspot", "h": "For a T-shirt, shipping is not the big one", "p": "For a typical T-shirt, production is the hotspot: about 97% of the CO₂. Transport is around 1% by ship, or around 14% by air freight. Fast-fashion sites such as Shein and Temu often send parcels by air.", "src": "Honest Tag model; Reuters, via Asia Financial (July 2025)", "url": "https://www.asiafinancial.com/air-cargo-from-china-to-us-sinks-after-end-of-tax-loophole", "chip": "Estimate", "go": "See the emission flow", "href": "calculator.html"}, {"tag": "Cotton", "h": "Cotton and pesticides: a large share, but a shrinking one", "p": "Cotton took about 20% of all insecticides in the 1990s. For 2018 to 2022, ICAC puts its share at about 10.5% of insecticides and 4% of all pesticides, on about 2.3% of the world’s arable land. That is about 3.6 kg of active ingredient per hectare, or roughly 4.7 g per kg of fibre: the figure The Honest Tag uses for conventional cotton. Organic cotton counts as zero.", "src": "International Cotton Advisory Committee (ICAC): The ICAC Recorder (June 2024) and cotton pesticide facts", "url": "https://icac.org/wp-content/uploads/2024/11/e-cotton-Recorder-2-2024-V21.pdf", "chip": "Sourced", "go": "See pesticide use for your garment", "href": "calculator.html"}, {"tag": "Microplastics", "h": "Synthetic clothes shed plastic when washed", "p": "The IUCN estimated in 2017 that almost two-thirds of the primary microplastics in the oceans come from two sources: the washing of synthetic textiles and the abrasion of tyres. The Ellen MacArthur Foundation puts microfibres reaching the ocean at around half a million tonnes a year.", "src": "IUCN (2017); Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://iucn.org/news/secretariat/201702/invisible-plastic-particles-textiles-and-tyres-major-source-ocean-pollution-%E2%80%93-iucn-study", "chip": "Sourced", "go": "See the shedding for your garment", "href": "calculator.html"}, {"tag": "End of life", "h": "Almost no clothing is recycled into new clothing", "p": "Less than 1% of the material used to make clothing is recycled into new clothing, and over 97% of the fibre going in is virgin (2015 data).", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Sourced", "go": "Compare regions", "href": "calculator.html"}, {"tag": "What helps", "h": "Wearing it longer is the simplest lever", "p": "WRAP research reported in 2015 estimates that extending a garment’s active life by nine months would cut its carbon, water and waste footprints by roughly 20% to 30% each.", "src": "WRAP, clothing durability report, as reported by Let’s Recycle (December 2015)", "url": "https://www.letsrecycle.com/news/wrap-publishes-clothing-sustainability-guide/", "chip": "Sourced", "go": "Try more wears on the Home", "href": "./"}]}, "it": {"title": "Scopri – The Honest Tag", "h1": "Cosa significano i numeri e da dove vengono.", "intro": "Fatti brevi su abiti e ambiente.", "src": "Fonte", "cards": [{"tag": "Metodo", "h": "Cos’è una valutazione del ciclo di vita, e cosa non è", "p": "Una valutazione del ciclo di vita (LCA) somma l’impatto ambientale di un prodotto lungo tutta la sua vita. «Dalla culla al cancello» si ferma all’uscita della fabbrica; «dalla culla alla tomba» conta anche uso e smaltimento. Il metodo è definito dalle norme ISO 14040 e 14044. Il risultato è una stima di massima: serve a confrontare scelte, non a certificare un capo.", "src": "ISO 14040:2006 e ISO 14044:2006", "url": "", "chip": "Norma", "go": "Come lo calcoliamo", "href": "calculator.html#data"}, {"tag": "Scala", "h": "La produzione di abiti è raddoppiata e indossiamo ogni capo meno", "p": "Tra il 2000 e il 2015 circa, la produzione di abbigliamento è quasi raddoppiata. Nello stesso periodo il numero di volte in cui un capo viene indossato prima di essere buttato è calato del 36%.", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Da fonte"}, {"tag": "Clima e acqua", "h": "Tessili: 1,2 miliardi di tonnellate di CO₂e e 93 miliardi di m³ d’acqua all’anno", "p": "Lo stesso rapporto stima che la produzione tessile abbia emesso circa 1,2 miliardi di tonnellate di CO₂e nel 2015 e usato circa 93 miliardi di metri cubi d’acqua all’anno, coltivazione del cotone compresa. Studi più recenti danno totali diversi: leggi questi numeri come ordine di grandezza.", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Da fonte"}, {"tag": "Punto critico", "h": "Per una maglietta, il trasporto non è il problema principale", "p": "Per una maglietta tipica la produzione è il punto critico: circa il 97% della CO₂. Il trasporto pesa circa l’1% via nave o circa il 14% via aereo. I siti di moda ultra-veloce come Shein e Temu spediscono spesso i pacchi in aereo.", "src": "Modello Honest Tag; Reuters, tramite Asia Financial (luglio 2025)", "url": "https://www.asiafinancial.com/air-cargo-from-china-to-us-sinks-after-end-of-tax-loophole", "chip": "Stima", "go": "Vedi il flusso delle emissioni", "href": "calculator.html"}, {"tag": "Cotone", "h": "Cotone e pesticidi: una quota grande, ma in calo", "p": "Negli anni ’90 il cotone assorbiva circa il 20% di tutti gli insetticidi. Per il periodo 2018–2022 l’ICAC stima la sua quota in circa il 10,5% degli insetticidi e il 4% di tutti i pesticidi, su circa il 2,3% dei terreni coltivabili del mondo. Sono circa 3,6 kg di principio attivo per ettaro, cioè circa 4,7 g per kg di fibra: il valore che The Honest Tag usa per il cotone convenzionale. Il cotone biologico conta zero.", "src": "Comitato consultivo internazionale del cotone (ICAC): The ICAC Recorder (giugno 2024) e dati sui pesticidi nel cotone", "url": "https://icac.org/wp-content/uploads/2024/11/e-cotton-Recorder-2-2024-V21.pdf", "chip": "Da fonte", "go": "Vedi i pesticidi del tuo capo", "href": "calculator.html"}, {"tag": "Microplastiche", "h": "I capi sintetici rilasciano plastica quando si lavano", "p": "Nel 2017 la IUCN ha stimato che quasi due terzi delle microplastiche primarie negli oceani vengano da due fonti: il lavaggio dei tessili sintetici e l’usura degli pneumatici. L’Ellen MacArthur Foundation stima in circa mezzo milione di tonnellate l’anno le microfibre che arrivano in mare.", "src": "IUCN (2017); Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://iucn.org/news/secretariat/201702/invisible-plastic-particles-textiles-and-tyres-major-source-ocean-pollution-%E2%80%93-iucn-study", "chip": "Da fonte", "go": "Vedi il rilascio del tuo capo", "href": "calculator.html"}, {"tag": "Fine vita", "h": "Quasi nessun abito diventa un nuovo abito", "p": "Meno dell’1% del materiale usato per fare abiti viene riciclato in nuovi abiti e oltre il 97% della fibra in ingresso è vergine (dati 2015).", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Da fonte", "go": "Confronta le regioni", "href": "calculator.html"}, {"tag": "Cosa aiuta", "h": "Indossarlo più a lungo è la leva più semplice", "p": "Una ricerca WRAP riportata nel 2015 stima che prolungare di nove mesi la vita attiva di un capo ridurrebbe di circa il 20-30% ciascuna l’impronta di carbonio, di acqua e di rifiuti.", "src": "WRAP, rapporto sulla durabilità dell’abbigliamento, riportato da Let’s Recycle (dicembre 2015)", "url": "https://www.letsrecycle.com/news/wrap-publishes-clothing-sustainability-guide/", "chip": "Da fonte", "go": "Prova più utilizzi nella Home", "href": "./"}]}, "es": {"title": "Aprende – The Honest Tag", "h1": "Qué significan los números y de dónde vienen.", "intro": "Datos breves sobre la ropa y el medio ambiente.", "src": "Fuente", "cards": [{"tag": "Método", "h": "Qué es un análisis de ciclo de vida, y qué no es", "p": "Un análisis de ciclo de vida (ACV) suma el impacto ambiental de un producto a lo largo de su vida. «De la cuna a la puerta» termina a la salida de la fábrica; «de la cuna a la tumba» cuenta también el uso y el desecho. El método está recogido en las normas ISO 14040 y 14044. El resultado es una estimación preliminar: sirve para comparar opciones, no para certificar una prenda.", "src": "ISO 14040:2006 e ISO 14044:2006", "url": "", "chip": "Norma", "go": "Cómo lo calculamos", "href": "calculator.html#data"}, {"tag": "Escala", "h": "La producción de ropa se ha duplicado y usamos cada prenda menos", "p": "Entre 2000 y 2015, aproximadamente, la producción de ropa se duplicó. En el mismo periodo, el número de veces que se lleva una prenda antes de tirarla cayó un 36 %.", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Con fuente"}, {"tag": "Clima y agua", "h": "Textiles: 1200 millones de toneladas de CO₂e y 93 000 millones de m³ de agua al año", "p": "El mismo informe estima que la producción textil emitió unos 1200 millones de toneladas de CO₂e en 2015 y usó alrededor de 93 000 millones de metros cúbicos de agua al año, incluido el cultivo del algodón. Estudios más recientes dan totales distintos: lee estas cifras como un orden de magnitud.", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Con fuente"}, {"tag": "Punto crítico", "h": "En una camiseta, el transporte no es lo más importante", "p": "En una camiseta típica la producción es el punto crítico: cerca del 97 % del CO₂. El transporte pesa alrededor del 1 % por barco o alrededor del 14 % por avión. Las webs de moda rápida como Shein y Temu envían a menudo los paquetes por avión.", "src": "Modelo Honest Tag; Reuters, vía Asia Financial (julio de 2025)", "url": "https://www.asiafinancial.com/air-cargo-from-china-to-us-sinks-after-end-of-tax-loophole", "chip": "Estimación", "go": "Ver el flujo de emisiones", "href": "calculator.html"}, {"tag": "Algodón", "h": "Algodón y pesticidas: una parte grande, pero cada vez menor", "p": "En los años 90 el algodón se llevaba cerca del 20 % de todos los insecticidas. Para 2018–2022, el ICAC sitúa su parte en cerca del 10,5 % de los insecticidas y el 4 % de todos los pesticidas, en cerca del 2,3 % de la tierra cultivable del mundo. Son unos 3,6 kg de principio activo por hectárea, o unos 4,7 g por kg de fibra: la cifra que The Honest Tag usa para el algodón convencional. El algodón ecológico cuenta como cero.", "src": "Comité Consultivo Internacional del Algodón (ICAC): The ICAC Recorder (junio de 2024) y datos sobre pesticidas en el algodón", "url": "https://icac.org/wp-content/uploads/2024/11/e-cotton-Recorder-2-2024-V21.pdf", "chip": "Con fuente", "go": "Ver los pesticidas de tu prenda", "href": "calculator.html"}, {"tag": "Microplásticos", "h": "La ropa sintética suelta plástico al lavarse", "p": "La UICN estimó en 2017 que casi dos tercios de los microplásticos primarios de los océanos proceden de dos fuentes: el lavado de textiles sintéticos y el desgaste de los neumáticos. La Fundación Ellen MacArthur calcula en medio millón de toneladas al año las microfibras que llegan al océano.", "src": "UICN (2017); Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://iucn.org/news/secretariat/201702/invisible-plastic-particles-textiles-and-tyres-major-source-ocean-pollution-%E2%80%93-iucn-study", "chip": "Con fuente", "go": "Ver lo que suelta tu prenda", "href": "calculator.html"}, {"tag": "Fin de vida", "h": "Casi nada de ropa se recicla para hacer ropa nueva", "p": "Menos del 1 % del material usado para fabricar ropa se recicla en ropa nueva, y más del 97 % de la fibra que entra es virgen (datos de 2015).", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Con fuente", "go": "Comparar regiones", "href": "calculator.html"}, {"tag": "Qué ayuda", "h": "Llevarla más tiempo es la palanca más sencilla", "p": "Una investigación de WRAP publicada en 2015 estima que alargar nueve meses la vida activa de una prenda reduciría entre un 20 % y un 30 % cada una sus huellas de carbono, de agua y de residuos.", "src": "WRAP, informe sobre durabilidad de la ropa, recogido por Let’s Recycle (diciembre de 2015)", "url": "https://www.letsrecycle.com/news/wrap-publishes-clothing-sustainability-guide/", "chip": "Con fuente", "go": "Prueba más usos en Inicio", "href": "./"}]}, "de": {"title": "Wissen – The Honest Tag", "h1": "Was die Zahlen bedeuten und woher sie kommen.", "intro": "Kurze Fakten zu Kleidung und Umwelt.", "src": "Quelle", "cards": [{"tag": "Methode", "h": "Was eine Ökobilanz ist und was nicht", "p": "Eine Ökobilanz (LCA) addiert die Umweltwirkung eines Produkts über sein ganzes Leben. „Von der Wiege bis zum Werkstor“ endet am Fabriktor; „von der Wiege bis zur Bahre“ zählt auch Nutzung und Entsorgung. Die Methode ist in den Normen ISO 14040 und 14044 beschrieben. Das Ergebnis ist eine Orientierungsschätzung: Es soll Entscheidungen vergleichen, nicht ein einzelnes Kleidungsstück zertifizieren.", "src": "ISO 14040:2006 und ISO 14044:2006", "url": "", "chip": "Norm", "go": "So rechnen wir", "href": "calculator.html#data"}, {"tag": "Ausmaß", "h": "Die Kleidungsproduktion hat sich verdoppelt, und wir tragen jedes Teil seltener", "p": "Zwischen etwa 2000 und 2015 hat sich die Kleidungsproduktion ungefähr verdoppelt. Im selben Zeitraum sank die Zahl der Male, die ein Kleidungsstück getragen wird, bevor es weggeworfen wird, um 36 %.", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Belegt"}, {"tag": "Klima und Wasser", "h": "Textilien: 1,2 Milliarden Tonnen CO₂e und 93 Milliarden m³ Wasser im Jahr", "p": "Derselbe Bericht schätzt, dass die Textilproduktion 2015 etwa 1,2 Milliarden Tonnen CO₂e ausstieß und rund 93 Milliarden Kubikmeter Wasser pro Jahr verbrauchte, einschließlich des Baumwollanbaus. Neuere Studien nennen andere Summen, lies diese Zahlen daher als Größenordnung.", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Belegt"}, {"tag": "Brennpunkt", "h": "Bei einem T-Shirt ist der Transport nicht das Hauptproblem", "p": "Bei einem typischen T-Shirt ist die Produktion der Brennpunkt: etwa 97 % des CO₂. Der Transport macht etwa 1 % per Schiff oder etwa 14 % per Luftfracht aus. Fast-Fashion-Seiten wie Shein und Temu verschicken Pakete oft per Flugzeug.", "src": "Honest-Tag-Modell; Reuters, über Asia Financial (Juli 2025)", "url": "https://www.asiafinancial.com/air-cargo-from-china-to-us-sinks-after-end-of-tax-loophole", "chip": "Schätzung", "go": "Emissionsfluss ansehen", "href": "calculator.html"}, {"tag": "Baumwolle", "h": "Baumwolle und Pestizide: ein großer, aber schrumpfender Anteil", "p": "In den 1990er-Jahren entfielen etwa 20 % aller Insektizide auf Baumwolle. Für 2018 bis 2022 beziffert das ICAC ihren Anteil auf etwa 10,5 % der Insektizide und 4 % aller Pestizide, auf etwa 2,3 % der weltweiten Ackerfläche. Das sind etwa 3,6 kg Wirkstoff pro Hektar oder rund 4,7 g pro kg Faser: der Wert, den The Honest Tag für konventionelle Baumwolle verwendet. Bio-Baumwolle zählt mit null.", "src": "Internationales Baumwoll-Beratungskomitee (ICAC): The ICAC Recorder (Juni 2024) und Fakten zu Pestiziden im Baumwollanbau", "url": "https://icac.org/wp-content/uploads/2024/11/e-cotton-Recorder-2-2024-V21.pdf", "chip": "Belegt", "go": "Pestizideinsatz deines Kleidungsstücks ansehen", "href": "calculator.html"}, {"tag": "Mikroplastik", "h": "Synthetische Kleidung gibt beim Waschen Plastik ab", "p": "Die IUCN schätzte 2017, dass fast zwei Drittel des primären Mikroplastiks in den Ozeanen aus zwei Quellen stammen: dem Waschen synthetischer Textilien und dem Reifenabrieb. Die Ellen MacArthur Foundation beziffert die Mikrofasern, die ins Meer gelangen, auf etwa eine halbe Million Tonnen pro Jahr.", "src": "IUCN (2017); Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://iucn.org/news/secretariat/201702/invisible-plastic-particles-textiles-and-tyres-major-source-ocean-pollution-%E2%80%93-iucn-study", "chip": "Belegt", "go": "Abgabe deines Kleidungsstücks ansehen", "href": "calculator.html"}, {"tag": "Lebensende", "h": "Fast keine Kleidung wird zu neuer Kleidung recycelt", "p": "Weniger als 1 % des Materials für Kleidung wird zu neuer Kleidung recycelt, und über 97 % der eingesetzten Fasern sind neu (Daten von 2015).", "src": "Ellen MacArthur Foundation, A New Textiles Economy (2017)", "url": "https://www.ellenmacarthurfoundation.org/a-new-textiles-economy", "chip": "Belegt", "go": "Regionen vergleichen", "href": "calculator.html"}, {"tag": "Was hilft", "h": "Länger tragen ist der einfachste Hebel", "p": "Eine 2015 berichtete WRAP-Untersuchung schätzt, dass neun Monate längere Nutzung eines Kleidungsstücks seinen Kohlenstoff-, Wasser- und Abfall-Fußabdruck um jeweils etwa 20 bis 30 % senken würde.", "src": "WRAP, Bericht zur Haltbarkeit von Kleidung, berichtet von Let’s Recycle (Dezember 2015)", "url": "https://www.letsrecycle.com/news/wrap-publishes-clothing-sustainability-guide/", "chip": "Belegt", "go": "Mehr Tragen auf der Startseite testen", "href": "./"}]}};
